<div class="pagina">
  <header class="cabecalho">
  </header>

  <main class="conteudo">
    <section class="apresentacao">
      <h2>MedicaMap</h2>

      <p>
        Consulte dados de estoques de medicamentos do SUS, estabelecimentos e gerencie os dados utilizados pela plataforma.
      </p>
    </section>

    <section class="secao-opcoes">
      <div class="secao-cabecalho">
        <div>
          <h3>O que você deseja fazer?</h3>
          <p>Selecione uma das opções para continuar.</p>
        </div>
      </div>

      <div class="opcoes">
        <button type="button" class="card-opcao" (click)="visualizarConsulta()">

          <div class="opcao-icone icone-consulta">
            <span>⌕</span>
          </div>

          <div class="opcao-texto">
            <h4>Visualização de consultas</h4>
            <p>Consulte informações sobre medicamentos, estabelecimentos de saúde e estoques disponíveis.</p>
          </div>

          <div class="opcao-rodape">
            <span>Acessar consultas</span>
            <span class="seta">→</span>
          </div>
        </button>

        <button
          type="button"
          class="card-opcao"
          (click)="configurarInformacoes()">

          <div class="opcao-icone icone-configuracao">
            <span>⚙</span>
          </div>

          <div class="opcao-texto">
            <h4>Configurar informações</h4>
            <p>
              Gerencie a fonte de consulta, importe arquivos
              e administre o banco de dados local.
            </p>
          </div>

          <div class="opcao-rodape">
            <span>Configurar plataforma</span>
            <span class="seta">→</span>
          </div>
        </button>
      </div>
    </section>

    <footer class="rodape">
      <span>Consulta de dados de estoque de medicamentos do SUS</span>
    </footer>
  </main>
</div>
