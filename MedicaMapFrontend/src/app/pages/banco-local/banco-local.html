<div class="pagina">

  <h1>Banco Local</h1>

  <p>
    Gerencie os dados utilizados pelo MedicaMap.
  </p>

  <input #arquivoInput type="file" accept=".csv" hidden (change)="arquivoSelecionado($event)">
  <div class="opcoes">

    <button (click)="arquivoInput.click()">
      Importar planilha
    </button>

    <button (click)="instalarBanco()">
      Instalar banco de dados
    </button>

    <button (click)="removerBanco()">
      Remover banco de dados
    </button>

  </div>

  @if (nomeArquivo) {
    <p>
      Arquivo selecionado:
      <strong>{{ nomeArquivo }}</strong>
    </p>

    <button (click)="importarPlanilha()">
      Importar arquivo
    </button>
  }
</div>
